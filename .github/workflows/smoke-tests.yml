name: JE Login Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check required secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          JE_USERNAME: ${{ secrets.JE_USERNAME }}
          JE_PASSWORD: ${{ secrets.JE_PASSWORD }}
        run: |
          test -n "$BASE_URL" || (echo "BASE_URL secret is missing" && exit 1)
          test -n "$JE_USERNAME" || (echo "JE_USERNAME secret is missing" && exit 1)
          test -n "$JE_PASSWORD" || (echo "JE_PASSWORD secret is missing" && exit 1)

      - name: Run login test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          JE_USERNAME: ${{ secrets.JE_USERNAME }}
          JE_PASSWORD: ${{ secrets.JE_PASSWORD }}
        run: |
          python -m pytest tests/ui/login/test_login.py --tracing=retain-on-failure --screenshot=only-on-failure

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-artifacts
          path: test-results/
          if-no-files-found: ignore
