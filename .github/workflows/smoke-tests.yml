name: JE Login Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run login test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          JE_USERNAME: ${{ secrets.JE_USERNAME }}
          JE_PASSWORD: ${{ secrets.JE_PASSWORD }}
        run: |
          python -m pytest tests/ui/login/test_login.py --tracing=retain-on-failure --screenshot=only-on-failure
