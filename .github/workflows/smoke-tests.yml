      - name: Check required secrets
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          JE_USERNAME: ${{ secrets.JE_USERNAME }}
          JE_PASSWORD: ${{ secrets.JE_PASSWORD }}
        run: |
          test -n "$BASE_URL" || (echo "BASE_URL secret is missing" && exit 1)
          test -n "$JE_USERNAME" || (echo "JE_USERNAME secret is missing" && exit 1)
          test -n "$JE_PASSWORD" || (echo "JE_PASSWORD secret is missing" && exit 1)

      - name: Run login test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          JE_USERNAME: ${{ secrets.JE_USERNAME }}
          JE_PASSWORD: ${{ secrets.JE_PASSWORD }}
        run: >
          python -m pytest tests/ui/login/test_login.py
          --tracing=retain-on-failure
          --screenshot=only-on-failure