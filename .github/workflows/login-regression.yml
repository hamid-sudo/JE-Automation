name: JE Login Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      JE_USERNAME: ${{ secrets.JE_USERNAME }}
      JE_PASSWORD: ${{ secrets.JE_PASSWORD }}

    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all login scenarios
        run: |
          python -m pytest tests/ui/login/test_login_scenarios.py --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure

      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: login-regression-artifacts
          path: test-results/
          if-no-files-found: ignore
